name: CI

# Keeps the four packages honest on every push: a type error or a broken build
# should be caught here rather than on the machine an analyst is waiting for.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The browsers are only needed to execute tests, not to typecheck or build.
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # The server imports the generated client, so its types must exist before
      # typecheck. This reads prisma/schema.prisma; no database is touched.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (shared, server, agent, web)
        run: npm run typecheck

      - name: Build web UI
        run: npm run build

      # Proves the schema actually applies to a fresh SQLite file, which is the
      # step most likely to break after a schema edit.
      - name: Verify migrations apply to a fresh database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./ci.db
